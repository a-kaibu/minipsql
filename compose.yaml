services:
  minipsql:
    build:
      context: .
      dockerfile: docker/minipsql.Dockerfile
    image: minipsql:local
    command: ["serve", "--host", "0.0.0.0", "--port", "15432"]
    ports:
      - "${MINIPSQL_PORT:-15432}:15432"

  postgres-regress:
    build:
      context: .
      dockerfile: docker/postgres-regress.Dockerfile
    image: minipsql-postgres-regress:latest
    depends_on:
      - minipsql
    environment:
      MINIPSQL_HOST: minipsql
      MINIPSQL_PORT: "15432"
      MINIPSQL_USER: "${MINIPSQL_USER:-mini}"
      MINIPSQL_DB: "${MINIPSQL_DB:-default}"
    volumes:
      - ./external/postgres:/workspace/external/postgres:ro
      - ./reports/postgres-regress:/workspace/reports/postgres-regress

  sqlancer:
    build:
      context: .
      dockerfile: docker/sqlancer.Dockerfile
    image: minipsql-sqlancer:latest
    depends_on:
      - minipsql
    command:
      - "--timeout-seconds"
      - "${SQLANCER_TIMEOUT_SECONDS:-600}"
      - "--num-tries"
      - "${SQLANCER_TRIES:-1000}"
      - "--username"
      - "${MINIPSQL_USER:-mini}"
      - "--port"
      - "15432"
      - "--host"
      - "minipsql"
      - "postgres"
      - "--connection-url=postgresql://minipsql:15432/${MINIPSQL_DB:-default}"
      - "--test-tablespaces=false"
