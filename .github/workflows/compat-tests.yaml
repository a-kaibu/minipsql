name: Compatibility Tests

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "compose.yaml"
      - "docker/**"
      - "Taskfile.yml"
      - "aqua.yaml"
      - ".github/workflows/compat-tests.yaml"
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "compose.yaml"
      - "docker/**"
      - "Taskfile.yml"
      - "aqua.yaml"
      - ".github/workflows/compat-tests.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_results: ${{ steps.summary.outputs.has_results }}
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}
      errors: ${{ steps.summary.outputs.errors }}
      pass_rate: ${{ steps.summary.outputs.pass_rate }}
      sqlancer_status: ${{ steps.summary.outputs.sqlancer_status }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.local/share/aquaproj-aqua
          key: v2-aqua-installer-${{runner.os}}-${{runner.arch}}-${{hashFiles('aqua.yaml')}}
          restore-keys: |
            v2-aqua-installer-${{runner.os}}-${{runner.arch}}-

      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.60.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Cache Docker layers (postgres-regress)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/.buildx-cache-regress
          key: v1-buildx-regress-${{ runner.os }}-${{ hashFiles('docker/postgres-regress.Dockerfile') }}
          restore-keys: |
            v1-buildx-regress-${{ runner.os }}-

      - name: Cache Docker layers (sqlancer)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/.buildx-cache-sqlancer
          key: v1-buildx-sqlancer-${{ runner.os }}-${{ hashFiles('docker/sqlancer.Dockerfile') }}
          restore-keys: |
            v1-buildx-sqlancer-${{ runner.os }}-

      - parallel:
        - name: Build postgres-regress image
          uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
          with:
            context: .
            file: docker/postgres-regress.Dockerfile
            load: true
            tags: minipsql-postgres-regress:latest
            cache-from: type=local,src=/tmp/.buildx-cache-regress
            cache-to: type=local,dest=/tmp/.buildx-cache-regress-new,mode=max

        - name: Build sqlancer image
          uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
          with:
            context: .
            file: docker/sqlancer.Dockerfile
            load: true
            tags: minipsql-sqlancer:latest
            cache-from: type=local,src=/tmp/.buildx-cache-sqlancer
            cache-to: type=local,dest=/tmp/.buildx-cache-sqlancer-new,mode=max

      - name: Move Docker layer caches
        run: |
          rm -rf /tmp/.buildx-cache-regress /tmp/.buildx-cache-sqlancer
          mv /tmp/.buildx-cache-regress-new /tmp/.buildx-cache-regress
          mv /tmp/.buildx-cache-sqlancer-new /tmp/.buildx-cache-sqlancer

      - name: Build minipsql
        run: task build

      - name: Start minipsql server
        background: true
        run: ./dist/minipsql serve --host 0.0.0.0 --port 15432

      - name: Wait for minipsql to be ready
        run: |
          for _ in $(seq 1 100); do
            if pg_isready -h 127.0.0.1 -p 15432 -U mini 2>/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          echo "minipsql did not become ready" >&2
          exit 1

      - parallel:
        - name: Run PostgreSQL regress
          id: regress
          run: |
            task test:regress || true

        - name: Run SQLancer
          id: sqlancer
          env:
            SQLANCER_DB: sqlancer_test
          run: |
            set +e
            PGPASSWORD= psql -h 127.0.0.1 -p 15432 -U mini default \
              -c "CREATE DATABASE \"$SQLANCER_DB\""
            MINIPSQL_DB="$SQLANCER_DB" task sqlancer:ci
            status=$?
            PGPASSWORD= psql -h 127.0.0.1 -p 15432 -U mini default \
              -c "DROP DATABASE IF EXISTS \"$SQLANCER_DB\"" || true
            echo "status=$status" >> "$GITHUB_OUTPUT"
            exit 0

      - name: Stop minipsql server
        run: pkill -f 'minipsql serve' || true

      - name: Fix report directory ownership
        run: sudo chown -R "$(id -u):$(id -g)" reports/ || true

      - name: Aggregate regress reports
        run: |
          report_dir="reports/postgres-regress"
          combined_tsv="$report_dir/file-results.tsv"
          combined_per_file="$report_dir/per-file"
          mkdir -p "$combined_per_file"

          printf 'status\tfile\terror_count\tcompleted\n' > "$combined_tsv"

          success_files=0; failed_files=0; completed_files=0
          not_completed_files=0; total_errors=0; total_fatals=0; total_files=0

          for batch_dir in "$report_dir"/batch-*; do
            [ -d "$batch_dir" ] || continue
            [ -d "$batch_dir/per-file" ] && cp "$batch_dir/per-file"/* "$combined_per_file/" 2>/dev/null || true
            [ -f "$batch_dir/file-results.tsv" ] && tail -n +2 "$batch_dir/file-results.tsv" >> "$combined_tsv"
            if [ -f "$batch_dir/summary.txt" ]; then
              get() { grep -m1 "^$1=" "$batch_dir/summary.txt" | cut -d= -f2-; }
              success_files=$((success_files + $(get success_files)))
              failed_files=$((failed_files + $(get failed_files)))
              completed_files=$((completed_files + $(get completed_files)))
              not_completed_files=$((not_completed_files + $(get not_completed_files)))
              total_errors=$((total_errors + $(get error_count)))
              total_fatals=$((total_fatals + $(get fatal_count)))
              total_files=$((total_files + $(get total_files)))
            fi
          done

          overall_status=0
          [ "$total_errors" -gt 0 ] || [ "$failed_files" -gt 0 ] && overall_status=1

          {
            printf 'psql_runner=parallel-batched\n'
            printf 'batch_count=4\n'
            printf 'total_files=%s\n' "$total_files"
            printf 'success_files=%s\n' "$success_files"
            printf 'failed_files=%s\n' "$failed_files"
            printf 'completed_files=%s\n' "$completed_files"
            printf 'not_completed_files=%s\n' "$not_completed_files"
            printf 'psql_exit_status=%s\n' "$overall_status"
            printf 'error_count=%s\n' "$total_errors"
            printf 'fatal_count=%s\n' "$total_fatals"
            printf '\nFirst 200 errors (across all batches):\n'
            find "$combined_per_file" -name '*.stderr' \
              -exec grep -h -E '(^|: )(ERROR|FATAL|PANIC):' {} + 2>/dev/null | head -n 200 || true
          } > "$report_dir/summary.txt"

      - name: Generate summary
        id: summary
        run: |
          summary_file="reports/postgres-regress/summary.txt"
          if [ ! -f "$summary_file" ]; then
            echo "compat regress summary not found"
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          get_value() {
            key="$1"
            grep -E "^${key}=" "$summary_file" | tail -1 | cut -d= -f2- || true
          }

          passed="$(get_value success_files)"
          failed="$(get_value failed_files)"
          skipped="$(get_value not_completed_files)"
          errors="$(get_value error_count)"
          psql_status="$(get_value psql_exit_status)"
          sqlancer_status="${{ steps.sqlancer.outputs.status }}"

          passed="${passed:-0}"
          failed="${failed:-0}"
          skipped="${skipped:-0}"
          errors="${errors:-0}"
          psql_status="${psql_status:-1}"
          sqlancer_status="${sqlancer_status:-1}"
          total=$((passed + failed + errors))
          if [ "$total" -gt 0 ]; then
            pass_rate=$(awk "BEGIN { printf \"%.2f\", $passed * 100 / $total }")
          else
            pass_rate="0"
          fi

          if [ "$psql_status" -ne 0 ] && [ "$errors" -eq 0 ]; then
            errors=1
          fi
          if [ "$sqlancer_status" -ne 0 ]; then
            errors=$((errors + 1))
          fi

          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "errors=$errors" >> "$GITHUB_OUTPUT"
          echo "pass_rate=$pass_rate" >> "$GITHUB_OUTPUT"
          echo "sqlancer_status=$sqlancer_status" >> "$GITHUB_OUTPUT"
          echo "has_results=true" >> "$GITHUB_OUTPUT"

      - name: Write Job Summary
        run: |
          echo "## Compatibility Tests Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: \`${{ github.workflow }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run ID: \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.summary.outputs.has_results }}" != "true" ]; then
            echo ":warning: No parsable compatibility results were found in \`reports/postgres-regress/summary.txt\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          passed='${{ steps.summary.outputs.passed }}'
          failed='${{ steps.summary.outputs.failed }}'
          skipped='${{ steps.summary.outputs.skipped }}'
          errors='${{ steps.summary.outputs.errors }}'
          pass_rate='${{ steps.summary.outputs.pass_rate }}'
          sqlancer_status='${{ steps.summary.outputs.sqlancer_status }}'

          echo "| Metric | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|------:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Passed | ${passed} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Failed | ${failed} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Skipped | ${skipped} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Errors | ${errors} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SQLancer status | ${sqlancer_status} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Pass Rate** | **${pass_rate}%** |" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.summary.outputs.has_results == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const passed = '${{ steps.summary.outputs.passed }}';
            const failed = '${{ steps.summary.outputs.failed }}';
            const skipped = '${{ steps.summary.outputs.skipped }}';
            const errors = '${{ steps.summary.outputs.errors }}';
            const passRate = '${{ steps.summary.outputs.pass_rate }}';
            const sqlancerStatus = '${{ steps.summary.outputs.sqlancer_status }}';

            const body = `## Compatibility Test Summary

            | Metric | Count |
            |--------|-------|
            | Passed | ${passed} |
            | Failed | ${failed} |
            | Skipped | ${skipped} |
            | Errors | ${errors} |
            | SQLancer status | ${sqlancerStatus} |
            | **Pass Rate** | **${passRate}%** |

            <details>
            <summary>Run details</summary>

            - Workflow: \`${{ github.workflow }}\`
            - Run ID: \`${{ github.run_id }}\`
            - Commit: \`${{ github.sha }}\`
            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Compatibility Test Summary')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  publish-badge:
    needs: compat-tests
    if: always() && needs.compat-tests.outputs.has_results == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Build badge payload
        run: |
          passed='${{ needs.compat-tests.outputs.passed }}'
          failed='${{ needs.compat-tests.outputs.failed }}'
          skipped='${{ needs.compat-tests.outputs.skipped }}'
          errors='${{ needs.compat-tests.outputs.errors }}'

          if [ "$failed" -eq 0 ] && [ "$errors" -eq 0 ]; then
            color="brightgreen"
          elif [ "$passed" -gt 0 ]; then
            color="yellow"
          else
            color="red"
          fi

          mkdir -p .github/badges
          cat > .github/badges/compat-tests.json <<EOF
          {
            "schemaVersion": 1,
            "label": "compat-tests",
            "message": "success ${passed}, fail ${failed}, skip ${skipped}, error ${errors}",
            "color": "${color}"
          }
          EOF

      - name: Update badge data
        run: |
          if git diff --quiet -- .github/badges/compat-tests.json; then
            echo "No badge changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/compat-tests.json
          git commit -m "chore: update compatibility test badge data"
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git rebase "origin/${GITHUB_REF_NAME}"; then
            echo "::warning::Failed to rebase badge update onto latest ${GITHUB_REF_NAME}; skipping push."
            git rebase --abort || true
            exit 0
          fi
          if ! git push origin HEAD:${GITHUB_REF_NAME}; then
            echo "::warning::Failed to push badge update (likely concurrent push); skipping."
            exit 0
          fi
