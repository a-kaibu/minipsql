version: '3'

vars:
  MINIPSQL_BIN: '{{.MINIPSQL_BIN | default "dist/minipsql"}}'
  MINIPSQL_HOST: '{{.MINIPSQL_HOST | default "127.0.0.1"}}'
  MINIPSQL_PORT: '{{.MINIPSQL_PORT | default "15432"}}'
  MINIPSQL_USER: '{{.MINIPSQL_USER | default "mini"}}'
  MINIPSQL_DB: '{{.MINIPSQL_DB | default "default"}}'
  DOCKER_MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST | default "host.docker.internal"}}'
  SQLANCER_TRIES: '{{.SQLANCER_TRIES | default "1000"}}'
  SQLANCER_TIMEOUT_SECONDS: '{{.SQLANCER_TIMEOUT_SECONDS | default "600"}}'

tasks:
  test:
    desc: Run Go tests
    cmds:
      - go test -v -shuffle=on -race ./... 

  build:
    desc: Build minipsql host binary
    cmds:
      - mkdir -p dist
      - CGO_ENABLED=0 go build -trimpath -o {{.MINIPSQL_BIN}} .
      - |
        cgo_packages="$(CGO_ENABLED=0 go list -deps -f '{{`{{if .CgoFiles}}{{.ImportPath}}{{end}}`}}' ./... | sed '/^$/d')"
        if [ -n "$cgo_packages" ]; then
          printf '%s\n' "$cgo_packages"
          exit 1
        fi

  serve:
    desc: Start minipsql
    deps: [build]
    cmds:
      - ./{{.MINIPSQL_BIN}} serve --host {{.MINIPSQL_HOST}} --port {{.MINIPSQL_PORT}}

  docker:regress:
    desc: Build PostgreSQL regress psql image
    cmds:
      - docker compose build postgres-regress

  docker:sqlancer:
    desc: Build SQLancer image
    cmds:
      - docker compose build sqlancer

  docker:compat:
    desc: Build all compatibility test images
    cmds:
      - task: docker:regress
      - task: docker:sqlancer

  regress:
    desc: Run all upstream PostgreSQL regress SQL files against minipsql
    deps: [build, docker:regress]
    env:
      MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST}}'
      MINIPSQL_PORT: '{{.MINIPSQL_PORT}}'
      MINIPSQL_USER: '{{.MINIPSQL_USER}}'
      MINIPSQL_DB: '{{.MINIPSQL_DB}}'
    cmds:
      - mkdir -p reports/postgres-regress
      - |
        status=0
        ./{{.MINIPSQL_BIN}} serve --host 0.0.0.0 --port {{.MINIPSQL_PORT}} &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
        docker compose run --rm postgres-regress || status=$?
        exit $status

  regress:ci:
    desc: Run PostgreSQL regress assuming minipsql is already running (CI use)
    deps: [build, docker:regress]
    env:
      MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST}}'
      MINIPSQL_PORT: '{{.MINIPSQL_PORT}}'
      MINIPSQL_USER: '{{.MINIPSQL_USER}}'
      MINIPSQL_DB: '{{.MINIPSQL_DB}}'
    cmds:
      - mkdir -p reports/postgres-regress
      - docker compose run --rm postgres-regress

  test:regress:
    desc: Run PostgreSQL regress in parallel batches assuming minipsql is already running (CI use)
    vars:
      BATCH_COUNT: '{{.BATCH_COUNT | default "4"}}'
      PARALLELISM: '{{.PARALLELISM | default "4"}}'
    env:
      MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST}}'
      MINIPSQL_PORT: '{{.MINIPSQL_PORT}}'
      MINIPSQL_USER: '{{.MINIPSQL_USER}}'
      MINIPSQL_DB: '{{.MINIPSQL_DB}}'
    cmds:
      - mkdir -p reports/postgres-regress
      - |
        status=0
        pids=()
        for b in $(seq 0 $(({{.BATCH_COUNT}} - 1))); do
          REGRESS_BATCH=$b REGRESS_BATCH_COUNT={{.BATCH_COUNT}} REGRESS_PARALLELISM={{.PARALLELISM}} \
            docker compose run --rm \
              -e REGRESS_BATCH=$b \
              -e REGRESS_BATCH_COUNT={{.BATCH_COUNT}} \
              -e REGRESS_PARALLELISM={{.PARALLELISM}} \
              postgres-regress > /tmp/regress-batch-$b.log 2>&1 &
          pids+=($!)
        done
        for pid in "${pids[@]}"; do
          wait "$pid" || status=1
        done
        for b in $(seq 0 $(({{.BATCH_COUNT}} - 1))); do
          echo "=== batch $b ===" && cat /tmp/regress-batch-$b.log || true
        done
        exit $status

  sqlancer:
    desc: Run SQLancer PostgreSQL provider against minipsql
    deps: [build, docker:sqlancer]
    env:
      MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST}}'
      MINIPSQL_PORT: '{{.MINIPSQL_PORT}}'
      MINIPSQL_USER: '{{.MINIPSQL_USER}}'
      MINIPSQL_DB: '{{.MINIPSQL_DB}}'
      SQLANCER_TRIES: '{{.SQLANCER_TRIES}}'
      SQLANCER_TIMEOUT_SECONDS: '{{.SQLANCER_TIMEOUT_SECONDS}}'
    cmds:
      - mkdir -p reports/sqlancer
      - |
        status=0
        ./{{.MINIPSQL_BIN}} serve --host 0.0.0.0 --port {{.MINIPSQL_PORT}} &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
        docker compose run --rm sqlancer > reports/sqlancer/sqlancer.stdout 2> reports/sqlancer/sqlancer.stderr || status=$?
        exit $status

  sqlancer:ci:
    desc: Run SQLancer assuming minipsql is already running (CI use)
    deps: [build, docker:sqlancer]
    env:
      MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST}}'
      MINIPSQL_PORT: '{{.MINIPSQL_PORT}}'
      MINIPSQL_USER: '{{.MINIPSQL_USER}}'
      MINIPSQL_DB: '{{.MINIPSQL_DB}}'
      SQLANCER_TRIES: '{{.SQLANCER_TRIES}}'
      SQLANCER_TIMEOUT_SECONDS: '{{.SQLANCER_TIMEOUT_SECONDS}}'
    cmds:
      - mkdir -p reports/sqlancer
      - docker compose run --rm sqlancer > reports/sqlancer/sqlancer.stdout 2> reports/sqlancer/sqlancer.stderr

  compat:
    desc: Run Go tests, PostgreSQL regress, and SQLancer
    cmds:
      - task: test
      - task: regress
      - task: sqlancer
