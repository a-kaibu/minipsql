version: 2

project_name: minipsql

before:
  hooks:
    - go mod tidy

builds:
  - id: minipsql
    main: .
    binary: minipsql
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: minipsql
    ids:
      - minipsql
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
