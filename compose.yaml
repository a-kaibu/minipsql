services:
  postgres-regress:
    build:
      context: .
      dockerfile: docker/postgres-regress.Dockerfile
    image: minipsql-postgres-regress:latest
    environment:
      MINIPSQL_HOST: "${MINIPSQL_HOST:-host.docker.internal}"
      MINIPSQL_PORT: "${MINIPSQL_PORT:-15432}"
      MINIPSQL_USER: "${MINIPSQL_USER:-mini}"
      MINIPSQL_DB: "${MINIPSQL_DB:-default}"
      REGRESS_BATCH: "${REGRESS_BATCH:-}"
      REGRESS_BATCH_COUNT: "${REGRESS_BATCH_COUNT:-}"
      REGRESS_PARALLELISM: "${REGRESS_PARALLELISM:-8}"
      REGRESS_FILTER: "${REGRESS_FILTER:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./external/postgres:/workspace/external/postgres:ro
      - ./reports/postgres-regress:/workspace/reports/postgres-regress

  sqlancer:
    build:
      context: .
      dockerfile: docker/sqlancer.Dockerfile
    image: minipsql-sqlancer:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--timeout-seconds"
      - "${SQLANCER_TIMEOUT_SECONDS:-600}"
      - "--num-tries"
      - "${SQLANCER_TRIES:-1000}"
      - "--username"
      - "${MINIPSQL_USER:-mini}"
      - "--port"
      - "${MINIPSQL_PORT:-15432}"
      - "--host"
      - "${MINIPSQL_HOST:-host.docker.internal}"
      - "postgres"
      - "--connection-url=postgresql://${MINIPSQL_HOST:-host.docker.internal}:${MINIPSQL_PORT:-15432}/${MINIPSQL_DB:-default}"
      - "--test-tablespaces=false"
