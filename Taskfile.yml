version: '3'

vars:
  MINIPSQL_BIN: '{{.MINIPSQL_BIN | default "dist/minipsql"}}'
  MINIPSQL_HOST: '{{.MINIPSQL_HOST | default "127.0.0.1"}}'
  MINIPSQL_PORT: '{{.MINIPSQL_PORT | default "15432"}}'
  MINIPSQL_USER: '{{.MINIPSQL_USER | default "mini"}}'
  MINIPSQL_DB: '{{.MINIPSQL_DB | default "default"}}'
  DOCKER_MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST | default "host.docker.internal"}}'
  SQLANCER_TRIES: '{{.SQLANCER_TRIES | default "1000"}}'
  SQLANCER_TIMEOUT_SECONDS: '{{.SQLANCER_TIMEOUT_SECONDS | default "600"}}'

tasks:
  test:
    desc: Run Go tests
    cmds:
      - go test -v -shuffle=on -race ./... 

  build:
    desc: Build minipsql host binary
    cmds:
      - mkdir -p dist
      - CGO_ENABLED=0 go build -trimpath -o {{.MINIPSQL_BIN}} .
      - |
        cgo_packages="$(CGO_ENABLED=0 go list -deps -f '{{`{{if .CgoFiles}}{{.ImportPath}}{{end}}`}}' ./... | sed '/^$/d')"
        if [ -n "$cgo_packages" ]; then
          printf '%s\n' "$cgo_packages"
          exit 1
        fi

  serve:
    desc: Start minipsql
    deps: [build]
    cmds:
      - ./{{.MINIPSQL_BIN}} serve --host {{.MINIPSQL_HOST}} --port {{.MINIPSQL_PORT}}

  docker:regress:
    desc: Build PostgreSQL regress psql image
    cmds:
      - docker compose build postgres-regress

  docker:sqlancer:
    desc: Build SQLancer image
    cmds:
      - docker compose build sqlancer

  docker:compat:
    desc: Build all compatibility test images
    cmds:
      - task: docker:regress
      - task: docker:sqlancer

  regress:
    desc: Run all upstream PostgreSQL regress SQL files against minipsql
    deps: [build, docker:regress]
    env:
      MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST}}'
      MINIPSQL_PORT: '{{.MINIPSQL_PORT}}'
      MINIPSQL_USER: '{{.MINIPSQL_USER}}'
      MINIPSQL_DB: '{{.MINIPSQL_DB}}'
    cmds:
      - mkdir -p reports/postgres-regress
      - |
        status=0
        ./{{.MINIPSQL_BIN}} serve --host 0.0.0.0 --port {{.MINIPSQL_PORT}} &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
        docker compose run --rm postgres-regress || status=$?
        exit $status

  regress:ci:
    desc: Run PostgreSQL regress assuming minipsql is already running (CI use)
    deps: [build, docker:regress]
    env:
      MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST}}'
      MINIPSQL_PORT: '{{.MINIPSQL_PORT}}'
      MINIPSQL_USER: '{{.MINIPSQL_USER}}'
      MINIPSQL_DB: '{{.MINIPSQL_DB}}'
    cmds:
      - mkdir -p reports/postgres-regress
      - docker compose run --rm postgres-regress

  test:regress:
    desc: Run PostgreSQL regress in parallel batches assuming minipsql is already running (CI use)
    vars:
      BATCH_COUNT: '{{.BATCH_COUNT | default "4"}}'
      PARALLELISM: '{{.PARALLELISM | default "4"}}'
    env:
      MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST}}'
      MINIPSQL_PORT: '{{.MINIPSQL_PORT}}'
      MINIPSQL_USER: '{{.MINIPSQL_USER}}'
      MINIPSQL_DB: '{{.MINIPSQL_DB}}'
    cmds:
      - mkdir -p reports/postgres-regress
      - |
        # clean up any root-owned files from a previous run using a privileged container
        docker run --rm \
          -v "$(pwd)/reports/postgres-regress:/workspace/reports/postgres-regress" \
          alpine:latest sh -c 'rm -rf /workspace/reports/postgres-regress/*' 2>/dev/null || true
      - |
        status=0
        pids=()
        for b in $(seq 0 $(({{.BATCH_COUNT}} - 1))); do
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --add-host=host.docker.internal:host-gateway \
            -e MINIPSQL_HOST={{.DOCKER_MINIPSQL_HOST}} \
            -e MINIPSQL_PORT={{.MINIPSQL_PORT}} \
            -e MINIPSQL_USER={{.MINIPSQL_USER}} \
            -e MINIPSQL_DB={{.MINIPSQL_DB}} \
            -e REGRESS_BATCH=$b \
            -e REGRESS_BATCH_COUNT={{.BATCH_COUNT}} \
            -e REGRESS_PARALLELISM={{.PARALLELISM}} \
            -v "$(pwd)/external/postgres:/workspace/external/postgres:ro" \
            -v "$(pwd)/reports/postgres-regress:/workspace/reports/postgres-regress" \
            minipsql-postgres-regress:latest > /tmp/regress-batch-$b.log 2>&1 &
          pids+=($!)
        done
        for pid in "${pids[@]}"; do
          wait "$pid" || status=1
        done
        for b in $(seq 0 $(({{.BATCH_COUNT}} - 1))); do
          echo "=== batch $b ===" && cat /tmp/regress-batch-$b.log || true
        done

        # aggregate batch results into a single summary.txt
        report_dir="reports/postgres-regress"
        combined_tsv="$report_dir/file-results.tsv"
        combined_per_file="$report_dir/per-file"
        mkdir -p "$combined_per_file"
        printf 'status\tfile\terror_count\tcompleted\n' > "$combined_tsv"
        sf_total=0; ff_total=0; cf_total=0; nc_total=0
        te_total=0; tfa_total=0; tf_total=0
        for b in $(seq 0 $(({{.BATCH_COUNT}} - 1))); do
          batch_dir="$report_dir/batch-$b"
          [ -d "$batch_dir" ] || continue
          cp "$batch_dir/per-file"/* "$combined_per_file/" 2>/dev/null || true
          [ -f "$batch_dir/file-results.tsv" ] && tail -n +2 "$batch_dir/file-results.tsv" >> "$combined_tsv"
          summary="$batch_dir/summary.txt"
          [ -f "$summary" ] || continue
          sf_total=$((sf_total + $(grep -m1 '^success_files=' "$summary" | cut -d= -f2- || echo 0)))
          ff_total=$((ff_total + $(grep -m1 '^failed_files=' "$summary" | cut -d= -f2- || echo 0)))
          cf_total=$((cf_total + $(grep -m1 '^completed_files=' "$summary" | cut -d= -f2- || echo 0)))
          nc_total=$((nc_total + $(grep -m1 '^not_completed_files=' "$summary" | cut -d= -f2- || echo 0)))
          te_total=$((te_total + $(grep -m1 '^error_count=' "$summary" | cut -d= -f2- || echo 0)))
          tfa_total=$((tfa_total + $(grep -m1 '^fatal_count=' "$summary" | cut -d= -f2- || echo 0)))
          tf_total=$((tf_total + $(grep -m1 '^total_files=' "$summary" | cut -d= -f2- || echo 0)))
        done
        overall=0
        if [ "$te_total" -gt 0 ] || [ "$ff_total" -gt 0 ]; then overall=1; fi
        {
          printf 'psql_runner=parallel-batched\n'
          printf 'batch_count={{.BATCH_COUNT}}\n'
          printf 'total_files=%s\n' "$tf_total"
          printf 'success_files=%s\n' "$sf_total"
          printf 'failed_files=%s\n' "$ff_total"
          printf 'completed_files=%s\n' "$cf_total"
          printf 'not_completed_files=%s\n' "$nc_total"
          printf 'psql_exit_status=%s\n' "$overall"
          printf 'error_count=%s\n' "$te_total"
          printf 'fatal_count=%s\n' "$tfa_total"
          printf '\nFirst 200 errors (across all batches):\n'
          find "$combined_per_file" -name '*.stderr' \
            -exec grep -h -E '(^|: )(ERROR|FATAL|PANIC):' {} + 2>/dev/null | head -n 200 || true
        } > "$report_dir/summary.txt"

        exit $status

  sqlancer:
    desc: Run SQLancer PostgreSQL provider against minipsql
    deps: [build, docker:sqlancer]
    env:
      MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST}}'
      MINIPSQL_PORT: '{{.MINIPSQL_PORT}}'
      MINIPSQL_USER: '{{.MINIPSQL_USER}}'
      MINIPSQL_DB: '{{.MINIPSQL_DB}}'
      SQLANCER_TRIES: '{{.SQLANCER_TRIES}}'
      SQLANCER_TIMEOUT_SECONDS: '{{.SQLANCER_TIMEOUT_SECONDS}}'
    cmds:
      - mkdir -p reports/sqlancer
      - |
        status=0
        ./{{.MINIPSQL_BIN}} serve --host 0.0.0.0 --port {{.MINIPSQL_PORT}} &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
        docker compose run --rm sqlancer > reports/sqlancer/sqlancer.stdout 2> reports/sqlancer/sqlancer.stderr || status=$?
        exit $status

  sqlancer:ci:
    desc: Run SQLancer assuming minipsql is already running (CI use)
    deps: [build, docker:sqlancer]
    env:
      MINIPSQL_HOST: '{{.DOCKER_MINIPSQL_HOST}}'
      MINIPSQL_PORT: '{{.MINIPSQL_PORT}}'
      MINIPSQL_USER: '{{.MINIPSQL_USER}}'
      MINIPSQL_DB: '{{.MINIPSQL_DB}}'
      SQLANCER_TRIES: '{{.SQLANCER_TRIES}}'
      SQLANCER_TIMEOUT_SECONDS: '{{.SQLANCER_TIMEOUT_SECONDS}}'
    cmds:
      - mkdir -p reports/sqlancer
      - docker compose run --rm sqlancer > reports/sqlancer/sqlancer.stdout 2> reports/sqlancer/sqlancer.stderr

  compat:
    desc: Run Go tests, PostgreSQL regress, and SQLancer
    cmds:
      - task: test
      - task: regress
      - task: sqlancer
